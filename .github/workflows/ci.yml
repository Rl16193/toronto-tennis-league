name: CI

on:
  push:
    branches:
      - dev-anuj
  pull_request:
    branches:
      - dev-anuj

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Push events expose the previous tip; pull requests expose their base tip. Supplying the
      # real comparison point keeps docs:verify fail-closed on architecture-sensitive changes.
      ARCHITECTURE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # docs:verify compares the change set to the branch tip; full history keeps that check
          # fail-closed instead of silently skipping architecture-sensitive mappings.
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repository quality gates
        run: npm run verify
