name: CI

on:
  push:
    branches:
      - dev-anuj
  pull_request:
    branches:
      - dev-anuj

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          # docs:verify compares the change set to the branch tip; full history keeps that check
          # fail-closed instead of silently skipping architecture-sensitive mappings.
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Run repository quality gates
        run: npm run verify
