# Weekly dependency checks for the site and the Cloud Functions. Security fixes open a PR at once;
# routine minor/patch updates are grouped into one PR per folder. See CLAUDE.md "Third-party code".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
