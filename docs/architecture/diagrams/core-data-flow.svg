<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc"><title id="title">Core data flow</title><desc id="desc">Members, organizers, browser and Functions move data through profile, match, rewards and contact flows.</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Montserrat:wght@400;500;600;700;800;900&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");:root{--paper:#EDEDE7;--ink:#143D34;--muted:#4F6A62;--soft:#6B8179;--accent:#FF6B35;--link:#2E6B58;--rule:rgba(20,61,52,.14)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,sans-serif}main{max-width:1320px;margin:auto;padding:32px 40px 48px}h1{margin:4px 0 8px;font:400 36px/1 Instrument Serif,serif}p{margin:0;color:var(--muted);font-size:13px}.eyebrow,.lane,.chip,.sub,.label{font-family:'Geist Mono',monospace}.eyebrow{font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}svg{width:100%;height:auto;margin-top:24px}.lane-fill{fill:rgba(20,61,52,.025)}.divider{stroke:rgba(20,61,52,.16);stroke-width:1}.lane{fill:var(--muted);font-size:9px;letter-spacing:.16em;font-weight:600}.step{fill:rgba(20,61,52,.12)}.step-focal{fill:rgba(255,107,53,.2)}.steptext{fill:var(--ink);font-size:9px;font-weight:600}.focaltext{fill:var(--accent)}.node{fill:#fff;stroke:var(--ink);stroke-width:1}.focal{fill:rgba(255,107,53,.10);stroke:var(--accent);stroke-width:1.5}.tag{fill:var(--muted);font:600 7px 'Geist Mono';letter-spacing:.1em}.name{fill:var(--ink);font-size:11px;font-weight:600}.sub{fill:var(--soft);font-size:8px}.arrow{fill:none;stroke:var(--muted);stroke-width:1.1;marker-end:url(#arr)}.trigger{stroke-dasharray:4 3}.accent-arrow{stroke:var(--accent);stroke-width:1.5;marker-end:url(#arr-accent)}.link-arrow{stroke:var(--link);marker-end:url(#arr-link)}.label{fill:var(--muted);font-size:8px}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4F6A62"/></marker><marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#FF6B35"/></marker><marker id="arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2E6B58"/></marker></defs>
<rect x="0" y="36" width="1280" height="80" class="lane-fill"/><rect x="0" y="196" width="1280" height="80" class="lane-fill"/><rect x="0" y="356" width="1280" height="80" class="lane-fill"/><line x1="0" y1="36" x2="1280" y2="36" class="divider"/><line x1="0" y1="116" x2="1280" y2="116" class="divider"/><line x1="0" y1="196" x2="1280" y2="196" class="divider"/><line x1="0" y1="276" x2="1280" y2="276" class="divider"/><line x1="0" y1="356" x2="1280" y2="356" class="divider"/><line x1="0" y1="436" x2="1280" y2="436" class="divider"/><line x1="140" y1="36" x2="140" y2="436" class="divider"/>
<g><rect x="180" y="6" width="32" height="16" rx="8" class="step"/><text x="196" y="17" text-anchor="middle" class="steptext">01</text><text x="196" y="31" text-anchor="middle" class="steptext">SIGN UP</text><rect x="292" y="6" width="32" height="16" rx="8" class="step"/><text x="308" y="17" text-anchor="middle" class="steptext">02</text><text x="308" y="31" text-anchor="middle" class="steptext">JOIN</text><rect x="404" y="6" width="32" height="16" rx="8" class="step"/><text x="420" y="17" text-anchor="middle" class="steptext">03</text><text x="420" y="31" text-anchor="middle" class="steptext">PLAY</text><rect x="516" y="6" width="32" height="16" rx="8" class="step-focal"/><text x="532" y="17" text-anchor="middle" class="steptext focaltext">04</text><text x="532" y="31" text-anchor="middle" class="steptext focaltext">AWARD</text><rect x="628" y="6" width="32" height="16" rx="8" class="step"/><text x="644" y="17" text-anchor="middle" class="steptext">05</text><text x="644" y="31" text-anchor="middle" class="steptext">CONNECT</text></g>
<text x="70" y="74" text-anchor="middle" class="lane">MEMBER</text><text x="70" y="84" text-anchor="middle" class="lane">ACTION</text><text x="70" y="154" text-anchor="middle" class="lane">ORGANIZER</text><text x="70" y="164" text-anchor="middle" class="lane">CONTROL</text><text x="70" y="234" text-anchor="middle" class="lane">BROWSER</text><text x="70" y="244" text-anchor="middle" class="lane">STATE</text><text x="70" y="314" text-anchor="middle" class="lane">FIREBASE</text><text x="70" y="324" text-anchor="middle" class="lane">SERVER</text><text x="70" y="394" text-anchor="middle" class="lane">PROJECTIONS</text><text x="70" y="404" text-anchor="middle" class="lane">+ SERVICES</text>
