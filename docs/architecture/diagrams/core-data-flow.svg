<g><rect x="258" y="124" width="100" height="64" rx="6" class="node"/><text x="308" y="151" text-anchor="middle" class="name">Create draw</text><text x="308" y="168" text-anchor="middle" class="sub">organizer</text></g><g><rect x="370" y="124" width="100" height="64" rx="6" class="node"/><text x="420" y="151" text-anchor="middle" class="name">Confirm</text><text x="420" y="168" text-anchor="middle" class="sub">fixture / score</text></g><g><rect x="482" y="124" width="100" height="64" rx="6" class="node"/><text x="532" y="151" text-anchor="middle" class="name">Review</text><text x="532" y="168" text-anchor="middle" class="sub">claim / match</text></g>
<g><rect x="146" y="204" width="100" height="64" rx="6" class="node"/><text x="196" y="231" text-anchor="middle" class="name">Auth</text><text x="196" y="248" text-anchor="middle" class="sub">uid</text></g><g><rect x="258" y="204" width="100" height="64" rx="6" class="node"/><text x="308" y="231" text-anchor="middle" class="name">Events</text><text x="308" y="248" text-anchor="middle" class="sub">read / write</text></g><g><rect x="370" y="204" width="100" height="64" rx="6" class="node"/><text x="420" y="231" text-anchor="middle" class="name">Matches</text><text x="420" y="248" text-anchor="middle" class="sub">category</text></g><g><rect x="482" y="204" width="100" height="64" rx="6" class="node"/><text x="532" y="231" text-anchor="middle" class="name">Tasks</text><text x="532" y="248" text-anchor="middle" class="sub">projection</text></g><g><rect x="594" y="204" width="100" height="64" rx="6" class="node"/><text x="644" y="231" text-anchor="middle" class="name">Contacts</text><text x="644" y="248" text-anchor="middle" class="sub">privacy gate</text></g>
