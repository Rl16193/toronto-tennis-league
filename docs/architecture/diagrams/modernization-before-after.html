<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modernization before and after — Racquets & Strings</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--paper:#EDEDE7;--ink:#143D34;--muted:#4F6A62;--soft:#6B8179;--accent:#FF6B35;--rule:rgba(20,61,52,.18)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,sans-serif}main{max-width:1320px;margin:auto;padding:32px 40px 48px}h1{margin:4px 0 8px;font:400 36px/1 Instrument Serif,serif}p{margin:0;color:var(--muted);font-size:13px}.eyebrow,.tag,.sub{font-family:'Geist Mono',monospace}.eyebrow{font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}svg{width:100%;height:auto;margin-top:24px}.panel{fill:rgba(20,61,52,.03);stroke:rgba(20,61,52,.22);stroke-width:1;stroke-dasharray:5 4}.before{fill:rgba(20,61,52,.07);stroke:var(--muted)}.after{fill:rgba(255,107,53,.10);stroke:var(--accent);stroke-width:1.3}.tag{fill:var(--muted);font-size:9px;letter-spacing:.12em;font-weight:600}.name{fill:var(--ink);font-size:15px;font-weight:600}.sub{fill:var(--soft);font-size:10px}.arrow{fill:none;stroke:var(--accent);stroke-width:1.8;marker-end:url(#arr)}</style></head><body><main><div class="eyebrow">Racquets &amp; Strings · takeover thesis</div><h1>From ambiguous operations to controlled evidence</h1><p>Modernization priorities are grounded in the current checkout’s branch, environment, authorization, and validation gaps.</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc"><title id="title">Before and after modernization</title><desc id="desc">Current state has ambiguous source and production defaults; target state has controlled branch, isolated environments, tests and server-authoritative privilege.</desc><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#FF6B35"/></marker></defs>

<g><rect x="88" y="132" width="388" height="56" rx="6" class="before"/><text x="108" y="155" class="name">Source of truth is branch-dependent</text><text x="108" y="173" class="sub">main ≠ dev-anuj application history</text></g><g><rect x="88" y="204" width="388" height="56" rx="6" class="before"/><text x="108" y="227" class="name">Firebase default points at production</text><text x="108" y="245" class="sub">no checked-in emulator / staging path</text></g><g><rect x="88" y="276" width="388" height="56" rx="6" class="before"/><text x="108" y="299" class="name">Authorization is partly broad</text><text x="108" y="317" class="sub">event_creator flag + hardcoded super-admin</text></g><g><rect x="88" y="348" width="388" height="56" rx="6" class="before"/><text x="108" y="371" class="name">Scoring has two write authorities</text><text x="108" y="389" class="sub">Functions plus tournament client stats writes</text></g><g><rect x="88" y="420" width="388" height="56" rx="6" class="before"/><text x="108" y="443" class="name">No repository test evidence</text><text x="108" y="461" class="sub">rules, Functions, and build checks are manual</text></g>
