<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
    <title id="title">Authorization boundaries</title>
    <desc id="desc">Members, organizers, providers and admins enter through Firebase Auth; UI roles do not replace Firestore Rules or server functions.</desc>
    <defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Montserrat:wght@400;500;600;700;800;900&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");
    :root{--paper:#EDEDE7;--ink:#143D34;--muted:#4F6A62;--soft:#6B8179;--accent:#FF6B35}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,sans-serif}
    main{max-width:1320px;margin:auto;padding:32px 40px 48px}h1{margin:4px 0 8px;font:400 36px/1 Instrument Serif,serif}p{margin:0;color:var(--muted);font-size:13px}
    .eyebrow,.tag,.sub,.label{font-family:'Geist Mono',monospace}.eyebrow{font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}svg{width:100%;height:auto;margin-top:24px}
    .boundary{fill:rgba(255,107,53,.04);stroke:rgba(255,107,53,.55);stroke-width:1;stroke-dasharray:6 4}.node{fill:#fff;stroke:var(--ink);stroke-width:1.2}.security{fill:rgba(255,107,53,.1);stroke:var(--accent);stroke-width:1.5}.store{fill:rgba(20,61,52,.07);stroke:var(--muted)}
    .tag{fill:var(--muted);font-size:9px;font-weight:600;letter-spacing:.1em}.name{fill:var(--ink);font-size:15px;font-weight:600}.sub{fill:var(--soft);font-size:10px}.line{fill:none;stroke:var(--muted);stroke-width:1.3;marker-end:url(#arr)}.accentline{fill:none;stroke:var(--accent);stroke-width:1.7;marker-end:url(#arr-accent)}.label{fill:var(--muted);font-size:9px}
  </style>
      <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#4F6A62"/></marker>
      <marker id="arr-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#FF6B35"/></marker>
    </defs>
    <rect x="32" y="82" width="310" height="430" rx="8" class="boundary"/><rect x="370" y="82" width="264" height="430" rx="8" class="boundary"/><rect x="662" y="82" width="268" height="430" rx="8" class="boundary"/><rect x="958" y="82" width="290" height="430" rx="8" class="boundary"/>
    <rect x="48" y="88" width="152" height="18" fill="#EDEDE7"/><text x="124" y="101" text-anchor="middle" class="tag">USER INTENT</text><rect x="386" y="88" width="112" height="18" fill="#EDEDE7"/><text x="442" y="101" text-anchor="middle" class="tag">IDENTITY</text><rect x="678" y="88" width="154" height="18" fill="#EDEDE7"/><text x="755" y="101" text-anchor="middle" class="tag">CLIENT GATES</text><rect x="974" y="88" width="166" height="18" fill="#EDEDE7"/><text x="1057" y="101" text-anchor="middle" class="tag">AUTHORITATIVE DATA</text>
    <!-- Connectors terminate on the corresponding node edge. -->
    <path d="M212 168H420" class="line"/><path d="M212 268H380V216H420" class="line"/><path d="M212 368H380V216H420" class="line"/><path d="M212 468H350V216H420" class="line"/>
    <path d="M540 216H620V168H700" class="accentline"/><rect x="552" y="184" width="102" height="18" fill="#EDEDE7"/><text x="603" y="197" text-anchor="middle" class="label">authenticated UID</text>
    <path d="M824 168H1000V156" class="line"/><path d="M824 268H1000V256" class="line"/><path d="M824 368H1000V356" class="line"/><path d="M824 438H960V456H1040" class="accentline"/><rect x="866" y="426" width="74" height="18" fill="#EDEDE7"/><text x="903" y="439" text-anchor="middle" class="label">server write</text>
    <g><rect x="72" y="132" width="140" height="72" rx="6" class="node"/><text x="84" y="150" class="tag">BASE ROLE</text><text x="142" y="175" text-anchor="middle" class="name">Member</text><text x="142" y="193" text-anchor="middle" class="sub">every account</text></g>
    <g><rect x="72" y="232" width="140" height="72" rx="6" class="node"/><text x="84" y="250" class="tag">STACKED ROLE</text><text x="142" y="275" text-anchor="middle" class="name">Organizer</text><text x="142" y="293" text-anchor="middle" class="sub">event_creator flag</text></g>
    <g><rect x="72" y="332" width="140" height="72" rx="6" class="node"/><text x="84" y="350" class="tag">STACKED ROLE</text><text x="142" y="375" text-anchor="middle" class="name">Provider</text><text x="142" y="393" text-anchor="middle" class="sub">stringer / coach ref</text></g>
    <g><rect x="72" y="432" width="140" height="72" rx="6" class="security"/><text x="84" y="450" class="tag">STACKED ROLE</text><text x="142" y="475" text-anchor="middle" class="name">Admin</text><text x="142" y="493" text-anchor="middle" class="sub">hardcoded UID today</text></g>
    <g><rect x="420" y="180" width="120" height="72" rx="6" class="security"/><text x="432" y="198" class="tag">AUTH</text><text x="480" y="223" text-anchor="middle" class="name">Firebase Auth</text><text x="480" y="241" text-anchor="middle" class="sub">identity token</text></g>
    <g><rect x="700" y="132" width="124" height="72" rx="6" class="node"/><text x="712" y="150" class="tag">UX</text><text x="762" y="175" text-anchor="middle" class="name">UI role view</text><text x="762" y="193" text-anchor="middle" class="sub">not authority</text></g>
    <g><rect x="700" y="232" width="124" height="72" rx="6" class="node"/><text x="712" y="250" class="tag">RULES</text><text x="762" y="275" text-anchor="middle" class="name">Firestore Rules</text><text x="762" y="293" text-anchor="middle" class="sub">owner / fields</text></g>
    <g><rect x="700" y="332" width="124" height="72" rx="6" class="node"/><text x="712" y="350" class="tag">RULES</text><text x="762" y="375" text-anchor="middle" class="name">Storage Rules</text><text x="762" y="393" text-anchor="middle" class="sub">image / size</text></g>
    <g><rect x="700" y="402" width="124" height="72" rx="6" class="security"/><text x="712" y="420" class="tag">SERVER</text><text x="762" y="445" text-anchor="middle" class="name">Callable / triggers</text><text x="762" y="463" text-anchor="middle" class="sub">Admin SDK path</text></g>
    <g><rect x="1000" y="120" width="190" height="72" rx="6" class="store"/><text x="1012" y="138" class="tag">PUBLIC / PROFILE</text><text x="1095" y="163" text-anchor="middle" class="name">users · stats</text><text x="1095" y="181" text-anchor="middle" class="sub">public read today</text></g>
    <g><rect x="1000" y="220" width="190" height="72" rx="6" class="store"/><text x="1012" y="238" class="tag">PRIVATE</text><text x="1095" y="263" text-anchor="middle" class="name">contacts</text><text x="1095" y="281" text-anchor="middle" class="sub">owner / connection</text></g>
    <g><rect x="1000" y="320" width="190" height="72" rx="6" class="store"/><text x="1012" y="338" class="tag">STORAGE OBJECTS</text><text x="1095" y="363" text-anchor="middle" class="name">media / uploads</text><text x="1095" y="381" text-anchor="middle" class="sub">image + size rules</text></g>
    <g><rect x="1040" y="420" width="150" height="72" rx="6" class="security"/><text x="1052" y="438" class="tag">PRIVILEGED</text><text x="1115" y="463" text-anchor="middle" class="name">points / mail</text><text x="1115" y="481" text-anchor="middle" class="sub">Function-owned</text></g>
    <g transform="translate(72 548)"><rect width="14" height="14" rx="2" class="security"/><text x="24" y="11" class="sub">security / identity boundary</text><rect x="220" width="14" height="14" rx="2" class="store"/><text x="244" y="11" class="sub">persistent data</text><line x1="390" y1="7" x2="426" y2="7" class="accentline"/><text x="438" y="11" class="sub">authoritative handoff</text></g>
  </svg>